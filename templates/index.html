<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphLore Engine Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0B0F19;
            color: #F3F4F6;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .terminal {
            background-color: #05070C;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>

<body class="p-6 md:p-12 min-h-screen flex flex-col items-center">

    <!-- Header Section -->
    <header class="w-full max-w-5xl mb-8 text-center md:text-left">
        <h1
            class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
            GraphLore Engine <span
                class="text-sm font-semibold px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded border border-indigo-800">B2B
                SANDBOX</span>
        </h1>
        <p class="text-gray-400 mt-2 text-sm">Input your chaotic dream fragments or random concepts to view the
            structured JSON output generated for enterprise platforms.</p>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

        <!-- Left Column: Input Control Panel -->
        <section class="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-2xl space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Security Token
                    (Client Auth Header)</label>
                <input type="password" id="apiToken"
                    value="6bda5e443338c1a0c06aa1cf645238200be8b4126eeb8fd38f790f21e6016580"
                    class="w-full p-3 bg-gray-950 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Chaotic Creative
                    Input (Brain Dump / Dream Elements)</label>
                <textarea id="rawInput" rows="8"
                    placeholder="Type or paste chaotic fragments here... (e.g., ice-cream, school, exhibition, pokemon, danger)"
                    class="w-full p-3 bg-gray-950 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm leading-relaxed text-gray-200 resize-none"></textarea>
            </div>

            <button id="submitBtn" onclick="runEnginePipeline()"
                class="w-full py-3 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 active:scale-[0.99] transition font-semibold rounded-lg text-sm tracking-wide shadow-lg cursor-pointer">
                Execute Graph Translation
            </button>
        </section>

        <!-- Right Column: Live Terminal Output -->
        <section class="flex flex-col h-full min-h-[460px]">
            <div class="flex items-center justify-between px-4 py-2 bg-gray-800 rounded-t-xl border border-gray-700">
                <span class="text-xs font-mono text-gray-400 tracking-widest">ENGINE_RESPONSE_STREAM</span>
                <div class="flex space-x-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500/80"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500/80"></div>
                </div>
            </div>
            <pre id="terminalOutput"
                class="terminal flex-1 p-4 rounded-b-xl border-x border-b border-gray-700 text-xs text-green-400 overflow-y-auto whitespace-pre-wrap leading-relaxed">
// System idle. Standing by for client requests...
// Paste a chaotic narrative array on the left and hit execute.</pre>
        </section>
    </main>

    <script>
        async function runEnginePipeline() {
            const token = document.getElementById('apiToken').value;
            const text = document.getElementById('rawInput').value;
            const terminal = document.getElementById('terminalOutput');
            const button = document.getElementById('submitBtn');

            if (!text.trim()) {
                alert('Please enter some chaotic text elements to parse.');
                return;
            }

            button.disabled = true;
            button.innerText = "Processing Stateful Graph Nodes...";
            terminal.classList.remove('text-red-400', 'text-green-400');
            terminal.classList.add('text-blue-400');
            terminal.innerText = `[INFO] Initializing GraphLore payload assembly...\n[INFO] Authenticating client credentials...\n[INFO] Routing state machine to Google Gemini nodes... (Please wait)`;

            try {
                const response = await fetch('/api/v1/structure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-GraphLore-Token': token
                    },
                    body: JSON.stringify({
                        raw_text: text,
                        client_id: "sandbox_web_user_01"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Pipeline execution failure.');
                }

                terminal.classList.remove('text-blue-400');
                terminal.classList.add('text-green-400');
                terminal.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                terminal.classList.remove('text-blue-400');
                terminal.classList.add('text-red-400');
                terminal.innerText = `[CRITICAL EXCEPTION]\nError Processing Request: ${error.message}`;
            } finally {
                button.disabled = false;
                button.innerText = "Execute Graph Translation";
            }
        }
    </script>
</body>

</html>
